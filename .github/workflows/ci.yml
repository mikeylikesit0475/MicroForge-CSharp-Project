name: MicroForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore MicroForge.sln

    - name: Build Solution
      run: dotnet build MicroForge.sln --no-restore -c Release

    - name: Run Full Test Suite (Unit, Integration & Agent Evals)
      run: dotnet test MicroForge.sln --no-build -c Release --logger "console;verbosity=normal"